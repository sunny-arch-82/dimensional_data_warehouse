name: validate

on:
  push:
  pull_request:

jobs:
  python-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML pytest hypothesis
      - run: python -m compileall scripts dagster_project tests
      - run: pytest -q tests/test_metric_definitions.py
      - run: cp .env.example .env && docker compose config -q
